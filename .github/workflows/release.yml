name: Publish Foundry Release
on:
  push:
    branches: [main]
    paths:
      - module.json
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Package module
        id: package
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/main.js
          node --check scripts/belt.js
          node --test tests/belt-level.test.mjs
          node --check scripts/heather-mead.mjs
          node --check scripts/ragged-edge-dagger.mjs
          node --check scripts/shop-bows.mjs
          node --check scripts/shop-ammunition.mjs
          node --check scripts/shop-swords.mjs
          node --check scripts/last-watch-seal.mjs
          node --check scripts/profession-gear.mjs
          node --check scripts/potions.mjs
          node --test tests/profession-gear.test.mjs
          node --test tests/potions.test.mjs
          VERSION=$(node -p "require('./module.json').version")
          ASSET="lipatos-aindor-unique-items.zip"
          mkdir -p dist/lipatos-aindor-unique-items
          cp module.json dist/lipatos-aindor-unique-items/
          cp -R scripts dist/lipatos-aindor-unique-items/
          (cd dist && zip -qr "../${ASSET}" lipatos-aindor-unique-items)
          unzip -t "${ASSET}"
          unzip -p "${ASSET}" lipatos-aindor-unique-items/module.json | node -e '
            let input=""; process.stdin.on("data", d => input+=d);
            process.stdin.on("end", () => {
              const manifest=JSON.parse(input);
              if(manifest.id !== "lipatos-aindor-unique-items") process.exit(1);
              if(!manifest.esmodules?.every(p => p.startsWith("scripts/"))) process.exit(1);
              console.log("Verified package:", manifest.id, manifest.version);
            });
          '
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
      - name: Update permanent ZIP mirror (no GitHub Releases redirect)
        shell: bash
        run: |
          set -euo pipefail
          ASSET="${{ steps.package.outputs.asset }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$ASSET"
          if ! git diff --cached --quiet; then
            git commit -m "Update stable Foundry ZIP mirror for v${{ steps.package.outputs.version }}"
            git push origin HEAD:main
          fi
      - name: Create or refresh release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.package.outputs.version }}"
          ASSET="${{ steps.package.outputs.asset }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --latest \
              --title "LipatoS — Уникальные предметы Айндора $TAG" \
              --notes "Восемь зелий Айндора, включая малое лечение 2к4+2. После использования возвращается отдельный небольшой флакон с помощью LipatoS — Баффы и дебаффы v0.6.34."
          fi
